<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recetas Peruanas</title>
    <link rel="stylesheet" href="deco.css">
    <style>
    body{
        background-image: url("background.jpg");
        background-color: black;
        display: flex;
        justify-content: center;
        align-items: center;
        background-repeat: no-repeat;
        background-size: cover;
        position: relative; 
        padding: 20px;
        margin: 0;
        min-height: 100vh;
        box-sizing: border-box;
    }

    @font-face {
        font-family: 'Christmas_Buttermilk';
        src: url('Christmas_Buttermilk.otf') format('opentype');
    }

    h1{
        font-family: 'Christmas_Buttermilk', normal;
        text-decoration: underline;
        text-align: center;
        font-weight: bold;
        margin-top: 15px;
        color: white;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
    }

    .recetitas{
        width: 100%;
        max-width: 1200px;
        margin-top: 20px;
    }

    /* VISTA DE CUADRÍCULA */
    .grid-container {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 25px;
        padding: 20px;
        margin-bottom: 30px;
    }

    .receta-card {
        background-color: rgba(255, 255, 255, 0.85);
        border-radius: 15px;
        overflow: hidden;
        box-shadow: 0 6px 15px rgba(0,0,0,0.3);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        cursor: pointer;
        height: 100%;
        display: flex;
        flex-direction: column;
    }

    .receta-card:hover {
        transform: translateY(-10px);
        box-shadow: 0 12px 25px rgba(0,0,0,0.4);
    }

    .card-image {
        width: 100%;
        height: 200px;
        object-fit: cover;
        border-bottom: 3px solid #0078ff;
    }

    .card-content {
        padding: 20px;
        flex-grow: 1;
        display: flex;
        flex-direction: column;
    }

    .card-title {
        font-family: 'Christmas_Buttermilk', normal;
        font-size: 26px;
        color: #333;
        margin-bottom: 10px;
        text-align: center;
    }

    .card-info {
        font-family: Arial, sans-serif;
        color: #555;
        font-size: 14px;
        margin-bottom: 5px;
        display: flex;
        align-items: center;
    }

    .card-info i {
        margin-right: 8px;
        color: #0078ff;
    }

    .card-description {
        font-family: Arial, sans-serif;
        color: #666;
        font-size: 14px;
        line-height: 1.5;
        margin-top: 10px;
        flex-grow: 1;
    }

    /* VISTA DE DETALLE (oculta por defecto) */
    .detalle-container {
        display: none;
        animation: fadeIn 0.5s ease;
    }

    .ContenedorRecetas{
        border-radius: 15px;
        padding: 20px;
        margin-bottom: 25px;
        min-height: 1250px;
        box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        background-repeat: no-repeat;
        background-size: cover;
        position: relative;
    }

    .ContenedorElemento{
        backdrop-filter: blur(10px);
        border-radius: 10px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        background: rgba(255, 255, 255, 0.25);
        padding: 20px;
        text-align: left;
        margin-bottom: 15px;
    }

    .recetaCentrar{
        color: white;
        font-family: 'Christmas_Buttermilk', normal;
        text-align: center;
        font-size: 32px;
        font-weight: bold;
        margin-bottom: 15px;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
    }

    .ingredientes-lista, .procedimiento-lista {
        list-style-type: none;
        padding-left: 0;
    }

    .ingredientes-lista li, .procedimiento-lista li {
        font-family: Arial, sans-serif;
        font-size: 16px;
        color: #333;
        padding: 8px 0;
        border-bottom: 1px solid rgba(255,255,255,0.2);
    }

    .ingredientes-lista li:before {
        content: "•";
        color: #0078ff;
        font-weight: bold;
        margin-right: 10px;
    }

    .procedimiento-lista li {
        counter-increment: step-counter;
        margin-bottom: 15px;
        padding-left: 25px;
        position: relative;
    }

    .procedimiento-lista li:before {
        content: counter(step-counter);
        background-color: #0078ff;
        color: white;
        font-weight: bold;
        border-radius: 50%;
        width: 24px;
        height: 24px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        position: absolute;
        left: 0;
        top: 5px;
    }

    /* BOTONES */
    button{
        color: white;
        height: 45px;
        background-color: #0078ff;
        width: 180px;
        border: none;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        transition: all 0.3s ease;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        font-family: Arial, sans-serif;
    }

    button:hover{
        background-color: #005fcc;
        box-shadow: 0 6px 15px rgba(0,0,0,0.3);
        transform: translateY(-2px);
    }

    .button-container{
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 20px;
        margin-bottom: 20px;
    }

    .volver-btn {
        background-color: #28a745;
        width: 200px;
    }

    .volver-btn:hover {
        background-color: #218838;
    }

    .backgroundBlur{
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-image: url("background.jpg");
        background-repeat: no-repeat;
        background-size: cover;
        background-position: center;
        filter: blur(5px);
        z-index: -1;
    }

    /* ANIMACIONES */
    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    @keyframes cardAppear {
        from { 
            opacity: 0;
            transform: translateY(20px);
        }
        to { 
            opacity: 1;
            transform: translateY(0);
        }
    }

    .receta-card {
        animation: cardAppear 0.5s ease forwards;
        animation-delay: calc(var(--card-order) * 0.1s);
        opacity: 0;
    }

    /* RESPONSIVE */
    @media (max-width: 768px) {
        .grid-container {
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
            padding: 10px;
        }
        
        .recetitas {
            width: 95%;
            margin-top: 10px;
        }
        
        .card-title {
            font-size: 22px;
        }
        
        .button-container {
            flex-direction: column;
            align-items: center;
        }
        
        button {
            width: 90%;
            max-width: 300px;
        }
    }

    @media (max-width: 480px) {
        .grid-container {
            grid-template-columns: 1fr;
        }
        
        body {
            padding: 10px;
        }
        
        h1 {
            font-size: 28px;
        }
    }
    </style>
</head>
<body>
    <div class="backgroundBlur"></div>

    <div class="recetitas">
        <h1>RECETAS PERUANAS</h1>
        
        <!-- VISTA DE CUADRÍCULA -->
        <div id="grid-view" class="grid-container">
            <!-- Las tarjetas se generarán dinámicamente con JavaScript -->
        </div>
        
        <!-- VISTA DE DETALLE -->
        <div id="detail-view" class="detalle-container">
            <div class="ContenedorRecetas" id="ContenedorRecetas">
                <h2 id="recetaTitulo" class="recetaCentrar">Titulo</h2>
                <div class="ContenedorElemento" id="infoReceta">
                    <p id="duracion"></p>
                    <p id="porciones"></p>
                </div>
                <h2 class="recetaCentrar">Ingredientes</h2>
                <div class="ContenedorElemento">
                    <ul id="ingredientes" class="ingredientes-lista"></ul>
                </div>
                <h2 class="recetaCentrar">Procedimiento</h2>
                <div class="ContenedorElemento">
                    <ol id="procedimiento" class="procedimiento-lista"></ol>
                </div>
            </div>
            
            <div class="button-container">
                <button onclick="back()" class="nav-btn">Anterior</button>
                <button onclick="volverAGrid()" class="volver-btn">Volver a la Cuadrícula</button>
                <button onclick="next()" class="nav-btn">Siguiente</button>
            </div>
        </div>
    </div>
    
    <script>
    let recetasData = null;
    let actualItem = 0;
    let tamañoLista = 0;
    
    // Elementos de la vista de detalle
    const nombreReceta = document.getElementById("recetaTitulo");
    const duracion = document.getElementById("duracion");
    const porciones = document.getElementById("porciones");
    const ingredientesLista = document.getElementById("ingredientes");
    const procedimientoLista = document.getElementById("procedimiento");
    const contenedorGeneral = document.getElementById("ContenedorRecetas");
    const elementosContenedor = document.querySelectorAll(".ContenedorElemento");
    
    // Vistas
    const gridView = document.getElementById("grid-view");
    const detailView = document.getElementById("detail-view");
    
    // Cargar recetas al inicio
    cargarRecetas();
    
    async function cargarRecetas() {
        try {
            // Si no existe el archivo recetas.json, usar datos de ejemplo
            const response = await fetch('./recetas.json');
            recetasData = await response.json();
            inicializarApp();
        } catch (error) {
            console.error('Error cargando JSON, usando datos de ejemplo:', error);
            // Datos de ejemplo si no existe recetas.json
            recetasData = {
                "Ceviche Peruano": {
                    "Info": {
                        "duracion": "30 minutos",
                        "porciones": "4 personas",
                        "descripcion": "Plato bandera del Perú, fresco y delicioso"
                    },
                    "Ingredientes": [
                        "1 kg de pescado fresco (corvina o lenguado)",
                        "10 limones verdes",
                        "2 cebollas rojas",
                        "1 ají limo",
                        "Cilantro picado",
                        "Sal y pimienta al gusto",
                        "Camote sancochado",
                        "Choclo sancochado",
                        "Hojas de lechuga"
                    ],
                    "Procedimiento": [
                        "Cortar el pescado en cubos medianos y colocarlo en un recipiente",
                        "Exprimir los limones y verter el jugo sobre el pescado",
                        "Agregar la cebolla cortada en juliana, el ají limo picado y el cilantro",
                        "Mezclar suavemente y sazonar con sal y pimienta",
                        "Dejar marinar por 10-15 minutos",
                        "Servir acompañado de camote, choclo y lechuga"
                    ],
                    "Imagen": "https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80",
                    "color": "#4CAF50"
                }
            };
            inicializarApp();
        }
    }
    
    function inicializarApp(){
        tamañoLista = Object.keys(recetasData).length;
        crearGridRecetas();
    }
    
    function crearGridRecetas() {
        gridView.innerHTML = "";
        
        const recetas = Object.keys(recetasData);
        
        recetas.forEach((nombreReceta, index) => {
            const receta = recetasData[nombreReceta];
            
            // Crear tarjeta
            const card = document.createElement("div");
            card.className = "receta-card";
            card.style.setProperty("--card-order", index);
            
            // Imagen
            const img = document.createElement("img");
            img.className = "card-image";
            img.src = receta.Imagen;
            img.alt = nombreReceta;
            
            // Contenido de la tarjeta
            const content = document.createElement("div");
            content.className = "card-content";
            
            // Título
            const title = document.createElement("h3");
            title.className = "card-title";
            title.textContent = nombreReceta;
            
            // Información
            const infoDiv = document.createElement("div");
            infoDiv.className = "card-info";
            infoDiv.innerHTML = `<i>⏱️</i> ${receta.Info.duracion}`;
            
            const porcionesDiv = document.createElement("div");
            porcionesDiv.className = "card-info";
            porcionesDiv.innerHTML = `<i>👥</i> ${receta.Info.porciones}`;
            
            // Descripción
            const desc = document.createElement("p");
            desc.className = "card-description";
            desc.textContent = receta.Info.descripcion || "Deliciosa receta peruana";
            
            // Evento de clic
            card.onclick = () => mostrarDetalleReceta(index);
            
            // Ensamblar tarjeta
            content.appendChild(title);
            content.appendChild(infoDiv);
            content.appendChild(porcionesDiv);
            content.appendChild(desc);
            
            card.appendChild(img);
            card.appendChild(content);
            
            gridView.appendChild(card);
        });
    }
    
    function mostrarDetalleReceta(indice) {
        actualItem = indice;
        updateData();
        
        // Cambiar vistas
        gridView.style.display = "none";
        detailView.style.display = "block";
        
        // Scroll al inicio
        window.scrollTo(0, 0);
    }
    
    function volverAGrid() {
        // Cambiar vistas
        detailView.style.display = "none";
        gridView.style.display = "grid";
    }
    
    function back() {
        actualItem -= 1;
        if (actualItem < 0) {
            actualItem = tamañoLista - 1;
        }
        updateData();
    }
    
    function next() {
        actualItem += 1;
        if (actualItem > tamañoLista - 1) {
            actualItem = 0;
        }
        updateData();
    }
    
    function updateData() {
        const recetasNombres = Object.keys(recetasData);
        const recetaNombre = recetasNombres[actualItem];
        const receta = recetasData[recetaNombre];
        
        // Actualizar datos de la vista detalle
        nombreReceta.textContent = recetaNombre;
        duracion.innerHTML = `<strong>⏱️ Duración:</strong> ${receta.Info.duracion}`;
        porciones.innerHTML = `<strong>👥 Porciones:</strong> ${receta.Info.porciones}`;
        
        // Ingredientes
        ingredientesLista.innerHTML = "";
        receta.Ingredientes.forEach(ingrediente => {
            const li = document.createElement("li");
            li.textContent = ingrediente;
            ingredientesLista.appendChild(li);
        });
        
        // Procedimiento
        procedimientoLista.innerHTML = "";
        receta.Procedimiento.forEach(paso => {
            const li = document.createElement("li");
            li.textContent = paso;
            procedimientoLista.appendChild(li);
        });
        
        // Fondo e imagen
        contenedorGeneral.style.backgroundImage = `url('${receta.Imagen}')`;
        
        // Color de los contenedores
        const colorHex = receta.color;
        
        if (colorHex) {
            const rgbColor = hexToRgb(colorHex);
            
            if (rgbColor) {
                elementosContenedor.forEach(elemento => {
                    elemento.style.backgroundColor = `rgba(${rgbColor.r}, ${rgbColor.g}, ${rgbColor.b}, 0.6)`;
                });
            }
        }
    }
    
    function hexToRgb(hex) {
        const hexValue = hex.replace('#', '');
        const result = /^([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hexValue);
        
        return result ? {
            r: parseInt(result[1], 16),
            g: parseInt(result[2], 16),
            b: parseInt(result[3], 16)
        } : null;
    }
    </script>
</body>
</html>
