<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Usuario</title>
    <link rel="stylesheet" href="ejercicio_(LocalStorage).css">
</head>
<body>
    <header>
        <h1>Menú de Usuario</h1>
        <nav>
            <ul>
                <li><button id="cerrarSesion">Cerrar Sesión</button></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="saludo">
            <h2>Bienvenido</h2>
            <p id="mensajeSaludo"></p>
            <p id="ultimoLogin"></p>
        </section>

        <section id="perfil">
            <h3>Información del Perfil</h3>
            <p><strong>Usuario:</strong> <span id="usuarioPerfil"></span></p>
            <p><strong>Rol:</strong> Usuario Estándar</p>
            <p><strong>Estado:</strong> Activo</p>
        </section>

        <section id="actividades">
            <h3>Actividades Recientes</h3>
            <ul>
                <li>Inicio de sesión exitoso</li>
                <li>Perfil actualizado</li>
                <li>Configuración cambiada</li>
            </ul>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Mi Login. Todos los derechos reservados.</p>
    </footer>

    <script src="ejercicio_(LocalStorage)2.js"></script>
</body>
</html>
